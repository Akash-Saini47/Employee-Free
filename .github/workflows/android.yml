name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Unit tests
        working-directory: android-app
        run: gradle test --no-daemon

      - name: Assemble debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Assemble release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: salarywise-apks
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke-test:
    runs-on: ubuntu-latest
    # GitHub-hosted Android emulator startup is infrastructure-dependent.
    # Do not block APK delivery when the emulator service itself times out.
    continue-on-error: true
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Android Emulator smoke test
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          cores: 2
          working-directory: android-app
          script: |
            adb wait-for-device
            for i in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            adb shell input keyevent 82 || true
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb logcat -c
            gradle connectedDebugAndroidTest --no-daemon

      - name: Capture emulator logcat
        if: always()
        run: |
          timeout 90 adb logcat -d -v threadtime > salarywise-logcat.txt || true

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salarywise-emulator-logcat-${{ github.run_id }}
          path: salarywise-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
